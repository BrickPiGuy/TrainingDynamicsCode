experiment:
  run_name: chinchilla_optimal_85m_6s
  output_dir: experiment/runs
  seeds: [101, 202, 303, 404, 505, 606]
  target_tokens: 85000000
  checkpoint_tokens: 1000000
  eval_batches: 8
  eval_seed: 9001

# Chinchilla-optimal budget for this model.
#
# Model parameter count: ~4,262,144
# Hoffmann et al. (2022) optimal ratio: N_tokens ~= 20 * N_params
# Target tokens: 20 * 4,262,144 = 85,242,880 -> rounded to 85,000,000
#
# Dataset note: the tinystories_smoke tokenizer cache has ~428,628 train
# tokens, so each seed will cycle the data ~198 times to reach 85M tokens.
# This is intentional: the experiment studies training dynamics and
# stability metrics (val_loss, rolling_volatility, backslide_frequency)
# across the full Chinchilla-optimal compute horizon, including the
# repeated-data overfitting regime observed in the 20M baseline run.
#
# Comparison baseline: followup_cpu_rapid_20m_6s (same seeds, same model,
# same tokenizer -- 20M tokens = ~4.7x params, well below Chinchilla optimal)

data:
  dataset_name: roneneldan/TinyStories
  train_split: train
  validation_split: validation
  text_field: text
  cache_dir: experiment/data/tinystories_smoke
  tokenizer_path: experiment/data/tinystories_smoke/tokenizer.json
  tokenizer_vocab_size: 4096
  tokenizer_train_documents: 1000
  prepare_document_limit: 2000
  append_eos: true
  dtype: uint16

model:
  vocab_size: 4096
  block_size: 128
  n_layer: 4
  n_head: 4
  n_embd: 256
  dropout: 0.0
  multiple_of: 64
  rope_base: 10000.0

training:
  device: cpu
  precision: fp32
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0004
  min_learning_rate: 0.00004
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_tokens: 1000000
  compile: false
  num_workers: 0
  log_every_steps: 10
  checkpoint_every_tokens: 1000000
  keep_last_checkpoints: 2

telemetry:
  rolling_window: 5
  spike_min_delta: 0.01
  spike_z_threshold: 2.0
  stable_volatility_quantile: 0.25
  stable_spike_rate_max: 0.0
  stable_backslide_frequency_max: 1
