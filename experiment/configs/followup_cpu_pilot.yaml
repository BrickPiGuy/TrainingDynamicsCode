experiment:
  run_name: followup_cpu_pilot_100m
  output_dir: experiment/runs
  seeds: [101, 202, 303]
  target_tokens: 100000000
  checkpoint_tokens: 10000000
  eval_batches: 16
  eval_seed: 9001

data:
  dataset_name: roneneldan/TinyStories
  train_split: train
  validation_split: validation
  text_field: text
  cache_dir: experiment/data/tinystories
  tokenizer_path: experiment/data/tinystories/tokenizer.json
  tokenizer_vocab_size: 32000
  tokenizer_train_documents: 200000
  append_eos: true
  dtype: uint16

model:
  vocab_size: 32000
  block_size: 512
  n_layer: 14
  n_head: 12
  n_embd: 768
  dropout: 0.0
  multiple_of: 256
  rope_base: 10000.0

training:
  device: cpu
  precision: fp32
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_tokens: 10000000
  compile: false
  num_workers: 0
  log_every_steps: 10
  checkpoint_every_tokens: 10000000
  keep_last_checkpoints: 3

telemetry:
  rolling_window: 5
  spike_min_delta: 0.01
  spike_z_threshold: 2.0
  stable_volatility_quantile: 0.25
  stable_spike_rate_max: 0.0
  stable_backslide_frequency_max: 1
