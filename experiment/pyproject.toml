[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinystories-xpu-experiment"
version = "0.1.0"
description = "TinyStories repeated-seed Llama-style training experiment for Intel Arc torch.xpu."
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19",
    "huggingface-hub>=0.23",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pingouin>=0.5",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "tabulate>=0.9",
    "tokenizers>=0.15",
    "tqdm>=4.66"
]

[project.scripts]
tinystories-prepare = "tinystories_xpu.prepare_data:main"
tinystories-train = "tinystories_xpu.train:main"
tinystories-telemetry = "tinystories_xpu.telemetry:main"
tinystories-analyze = "tinystories_xpu.analyze:main"
tinystories-verify-xpu = "tinystories_xpu.verify_xpu:main"

[tool.setuptools.packages.find]
where = ["src"]
