<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Dynamics Code</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(180deg, #f7f8fb 0%, #eef1f6 100%);
        color: #1f2937;
      }

      main {
        width: min(680px, calc(100% - 32px));
        background: #ffffff;
        border: 1px solid #d7deea;
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 12px 24px rgba(31, 41, 55, 0.08);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 12px;
      }

      p {
        margin: 0;
        line-height: 1.6;
      }

      code {
        padding: 2px 6px;
        border-radius: 6px;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Training Dynamics Code</h1>
      <p>
        Legacy front-end code has been moved to
        <code>archive/board-ui-legacy/</code>.
      </p>
    </main>
  </body>
</html>
